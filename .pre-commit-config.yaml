fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  # secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  # local hooks (air and jarl must be installed)
  - repo: local
    hooks:
      - id: air-format
        name: air format
        entry: air format
        language: system
        types: [r]
      - id: jarl-check
        name: jarl check
        entry: jarl check
        language: system
        types: [r]
