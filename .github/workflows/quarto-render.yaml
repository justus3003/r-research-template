name: Render Quarto

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  render:
    name: quarto render
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-r-env

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: 🧪 Run data preparation
        run: Rscript R/01_prepare_data.R

      - name: 📓 Render documents
        run: quarto render analysis
