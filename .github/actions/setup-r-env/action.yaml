name: Setup R Environment
description: Common R project setup with rv and rproject.toml

inputs:
  r-version:
    description: R version (must match r_version in rproject.toml)
    default: "4.5"

runs:
  using: "composite"
  steps:
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ inputs.r-version }}
        use-public-rspm: true

    - name: Install rv
      shell: bash
      run: |
        curl -sSL https://raw.githubusercontent.com/A2-ai/rv/refs/heads/main/scripts/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Cache rv packages
      uses: actions/cache@v4
      with:
        path: |
          rv/library
          ~/.cache/rv
        key: rv-${{ runner.os }}-${{ inputs.r-version }}-${{ hashFiles('rv.lock', 'rproject.toml') }}
        restore-keys: |
          rv-${{ runner.os }}-${{ inputs.r-version }}-

    - name: 📦 Install dependencies
      shell: bash
      run: |
        export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
        rv sync

    - name: Point R at the rv library
      shell: bash
      run: |
        pkgdir=$(find rv/library -maxdepth 5 -type d -name here | head -n 1)
        if [ -z "$pkgdir" ]; then
          echo "rv library not found" >&2
          exit 1
        fi
        echo "R_LIBS=$(cd "$(dirname "$pkgdir")" && pwd)" >> "$GITHUB_ENV"
